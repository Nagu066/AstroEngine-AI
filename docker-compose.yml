version: '3.8'

services:
  astro-engine-ai:
    build: .
    container_name: astro-engine-ai
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=mock
      # - GEMINI_API_KEY=your_gemini_key_here
      # - OPENAI_API_KEY=your_openai_key_here
    restart: unless-stopped
